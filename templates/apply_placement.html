<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Application</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #f4f6f9;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Placement Application</h1>

    <p class="subtitle">
        Fill in your details to apply for the placement opportunity.
    </p>

    <form method="POST" action="/submit_placement"
          enctype="multipart/form-data">

        <div class="form-group">
            <label>Name <span class="required">*</span></label>
            <input type="text"
                   name="name"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="form-group">
            <label>Phone Number <span class="required">*</span></label>
            <input type="tel"
                   name="phone"
                   placeholder="Enter your phone number"
                   required>
        </div>

        <div class="form-group">
            <label>College Name <span class="required">*</span></label>
            <input type="text"
                   name="college"
                   placeholder="Enter your college name"
                   required>
        </div>

        <div class="form-group">
            <label>Department <span class="required">*</span></label>

            <select name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">Computer Science and Engineering</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="MECH">Mechanical Engineering</option>
                <option value="CIVIL">Civil Engineering</option>
            </select>
        </div>

        <div class="form-group">
            <label>CGPA <span class="required">*</span></label>

            <input type="number"
                   name="cgpa"
                   placeholder="Enter your CGPA"
                   min="0"
                   max="10"
                   step="0.01"
                   required>
        </div>

        <div class="form-group">
            <label>Skills</label>

            <textarea name="skills"
                      placeholder="Example: Python, Java, SQL, Communication"></textarea>
        </div>

        <div class="form-group">
            <label>Resume</label>

            <input type="file"
                   name="resume"
                   accept=".pdf,.doc,.docx">
        </div>

        <button type="submit" class="submit-btn">
            Submit Application
        </button>

    </form>

    <a href="/placement" class="back">
        ← Back to Placements
    </a>

</div>

</body>
</html>
