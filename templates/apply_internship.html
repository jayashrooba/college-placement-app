<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Application</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #f4f6f9;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #1d4ed8;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .back-button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Internship Application</h1>

    <p class="subtitle">
        Fill in your details to submit your internship application.
    </p>

    <form method="POST" action="/submit_internship"
          enctype="multipart/form-data">

        <label>Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <label>College Name</label>
        <input
            type="text"
            name="college"
            placeholder="Enter your college name"
            required
        >

        <label>Department</label>
        <select name="department" required>
            <option value="">Select Department</option>
            <option value="CSE">Computer Science and Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="ECE">Electronics and Communication Engineering</option>
            <option value="EEE">Electrical and Electronics Engineering</option>
            <option value="MECH">Mechanical Engineering</option>
            <option value="CIVIL">Civil Engineering</option>
        </select>

        <label>CGPA</label>
        <input
            type="number"
            name="cgpa"
            placeholder="Enter your CGPA"
            min="0"
            max="10"
            step="0.01"
            required
        >

        <label>Skills</label>
        <textarea
            name="skills"
            placeholder="Example: Python, SQL, Excel, HTML, CSS"
        ></textarea>

        <label>Resume</label>
        <input
            type="file"
            name="resume"
            accept=".pdf,.doc,.docx"
        >

        <button type="submit" class="submit-button">
            Submit Application
        </button>

    </form>

    <a href="/internship" class="back-button">
        ← Back to Internships
    </a>

</div>

</body>
</html>
